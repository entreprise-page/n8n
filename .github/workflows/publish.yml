# Publishes the package to npm, with a provenance statement, when a vX.Y.Z tag
# is pushed. n8n requires provenance for verified community nodes, and npm only
# generates it from a public repository: this workflow runs in
# entreprise-page/n8n, never in the private repository it is developed in.
#
# One-time setup: on npmjs.com, add a trusted publisher to the package
# (GitHub Actions, repository entreprise-page/n8n, workflow publish.yml).
# No npm token is stored.

name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing and provenance

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing requires npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: |
          npm run build
          npm test

      # The published version is the tag's: v1.2.0 publishes 1.2.0, whatever
      # package.json says (it stays at 0.0.0 in the source repository).
      - name: Set version
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # In GitHub Actions, `n8n-node release` lints, builds and runs
      # `npm publish` with provenance enabled.
      - name: Publish
        run: npm run release
